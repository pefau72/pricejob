<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="utf-8"> 
        <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
        <meta name="viewport" content="width=device-width, initial-scale=1"> 
        <meta name="description" content=""> 
        <meta name="author" content="Peter Fausbøll"> 
        <title>Regenda ApS</title>         
        <link href="/css/theme.css" rel="stylesheet" type="text/css"> 
        <link href="/css/style.css" rel="stylesheet">
        <script src="/js/chart.js"></script>         
    </head>     
    <body> 
        <div id="header-container"></div>         
        <div id="swup" class="page-container transition-fade"> 
            <section class="intro-section"> 
                <picture> 
                    <source media="(max-width: 768px)" srcset="/img/Konsulent_viser_vejen_mobil.png"> 
                    <source media="(min-width: 769px)" srcset="/img/Konsulent_viser_vejen_mobil.png"> 
                    <img src="/img/Konsulent_viser_vejen_mobil.png" alt="Peter Fausbøll" class="intro-photo"> 
                </picture>                 
                <div class="intro-text"> 
                    <h1 id="page-title">Elpriser</h1>
                    <div class="meta" id="page-meta">Indlæser data...</div>
                    <!-- Elementet hvor grafen vil blive tegnet -->
                    <canvas id="priceChart" style="width:100%; height:400px;"></canvas>                     
                </div>                 
            </section>             
        </div>         
        <div id="footer-container"></div>         
        <script src="/js/swup.min.js"></script>         
        <script src="/js/app.js"></script>
        <script>
        window.addEventListener('DOMContentLoaded', () => {    
        const jsonFile = "../pricedata/prices-2026-09-29.json"; // getLatestJsonFilename();
    // 2. Hent JSON-dataen og byg grafen
        fetch(jsonFile)
            .then(response => {
                if (!response.ok) throw new Error('Kunne ikke hente JSON-filen: ' + jsonFile);
                return response.json();
            })
            .then(data => {
                // Opdater tekst på siden
                document.getElementById('page-title').innerText = `Elpriser — D. ${data.date}`;
                document.getElementById('page-meta').innerText = `Enhed: ${data.unit} | Data genereret: ${new Date(data.generated_utc).toLocaleString('da-DK')}`;

                // Behandl JSON-objekterne til Chart.js format
                const labels = data.hours.map(item => {
                    // Formater ISO-tidsstempel til "HH:MM" (f.eks. 08:30)
                    const dateObj = new Date(item.ts);
                    return String(dateObj.getHours()).padStart(2, '0') + ':' + String(dateObj.getMinutes()).padStart(2, '0');
                });
                
                const dk1Prices = data.hours.map(item => item.dk1);
                const dk2Prices = data.hours.map(item => item.dk2);

                // 3. Konfigurer og opret diagrammet
                const ctx = document.getElementById('priceChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'DK1 (Vestdanmark)',
                                data: dk1Prices,
                                borderColor: '#3b82f6', // Blå
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                borderWidth: 2,
                                pointRadius: 1,
                                tension: 0.2
                            },
                            {
                                label: 'DK2 (Østdanmark)',
                                data: dk2Prices,
                                borderColor: '#ef4444', // Rød
                                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                borderWidth: 2,
                                pointRadius: 1,
                                tension: 0.2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'top' },
                            tooltip: { mode: 'index', intersect: false }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                title: { display: true, text: 'Tidspunkt på dagen' }
                            },
                            y: {
                                beginAtZero: false,
                                title: { display: true, text: data.unit }
                            }
                        }
                    }
                });
            })
            .catch(error => {
                document.getElementById('page-meta').innerText = "Fejl: " + error.message;
                console.error(error);
            });
                     
            });
          </script>
    </body>     
</html>
