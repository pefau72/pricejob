<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="utf-8"> 
        <title>Regenda</title>         
        <script>
        // Go to /en/index.html (or /de/index.html) from the bare root.
        // Remembers the last choice so a returning visitor lands where they left.
        const saved = localStorage.getItem("lang");
        const lang = (saved === "de") ? "de" : "en";
        window.location.replace(lang + "/index.html");
    </script>         
    </head>     
    <body> 
        <noscript> 
            <a href="/en/index.html">Continue</a> 
        </noscript>         
    </body>     
</html>
